services:
  barokahiin-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barokahiin-fe
    ports:
      - "8080:80"
    restart: unless-stopped

  barokahiin-dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
